# Lock the transit Vault down: only the farm Vault namespace (vault) may reach
# its API port. Everything else is denied. (kubectl port-forward still works —
# it goes through the kubelet, not the pod network, so admin access is fine.)
#
#   kubectl apply -n vault-transit -f helm/vtafarm-transit/networkpolicy.yaml
#
# RKE2's default CNI (Canal/Calico) enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-transit-allow-farm-only
  namespace: vault-transit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
