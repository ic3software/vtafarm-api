# Overrides for the official hashicorp/vault subchart, running as a SINGLE-NODE
# "transit" Vault. Everything is nested under `vault:` (dependency subchart).
#
# Install in namespace `vault-transit` with release name `vault-transit`.
vault:
  # Pin resource names to `vault-transit` so the service is
  # vault-transit.vault-transit.svc (what the farm's seal stanza points at).
  fullnameOverride: vault-transit

  global:
    # TLS on — the decrypt traffic effectively unwraps the farm's root key, so
    # it deserves the same protection as the farm Vault. Self-signed via
    # cert-manager (tls/cert-manager.yaml). The farm's seal uses tls_skip_verify.
    tlsDisable: false

  # No Agent Injector and no Kubernetes auth here — this Vault only serves the
  # transit decrypt call from the farm Vault (token auth), nothing else.
  injector:
    enabled: false

  ui:
    enabled: true

  server:
    # Not needed: this Vault does no TokenReview / Kubernetes auth.
    authDelegator:
      enabled: false

    # Tiny — it holds one key and does almost nothing.
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 500m

    dataStorage:
      enabled: true
      size: 1Gi

    extraEnvironmentVars:
      VAULT_CACERT: /vault/userconfig/vault-transit-tls/ca.crt
    volumes:
      - name: userconfig-vault-transit-tls
        secret:
          secretName: vault-transit-tls
    volumeMounts:
      - name: userconfig-vault-transit-tls
        mountPath: /vault/userconfig/vault-transit-tls
        readOnly: true

    # Single node, file storage. NO `seal` stanza — this Vault unseals with
    # Shamir keys (manual). It is the root of the unseal chain.
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          address       = "[::]:8200"
          tls_cert_file = "/vault/userconfig/vault-transit-tls/tls.crt"
          tls_key_file  = "/vault/userconfig/vault-transit-tls/tls.key"
        }

        storage "file" {
          path = "/vault/data"
        }
