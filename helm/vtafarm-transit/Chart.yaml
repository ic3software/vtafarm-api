apiVersion: v2
name: vtafarm-transit
description: >-
  Standalone single-node "transit" Vault for the VTA Farm. Its only job is to
  hold the `autounseal` transit key that the farm Vault (helm/vtafarm-vault)
  uses to auto-unseal — so the farm's 3 pods never need manual unsealing on
  restart. Stores NO tenant data. This Vault is itself sealed with Shamir keys
  and unsealed MANUALLY (it is the root of the unseal chain).

  Runs in its own namespace (vault-transit) in the SAME RKE2 cluster — the
  zero-cost, all-self-hosted option. NOTE: an in-cluster transit Vault does NOT
  protect against a full live cluster compromise (the unseal token lives in the
  cluster); it protects data-at-rest and avoids per-restart manual unsealing.
  Migrate to cloud KMS later by swapping the farm's `seal` stanza.
type: application
version: 0.1.0
appVersion: "2.0.2"

dependencies:
  - name: vault
    version: "0.33.0"
    repository: "https://helm.releases.hashicorp.com"
