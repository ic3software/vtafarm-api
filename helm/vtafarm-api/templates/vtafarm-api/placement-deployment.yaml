apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-placement
spec:
  replicas: {{ .Values.placement.workerReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-placement
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-placement
    spec:
      serviceAccountName: {{ .Values.name }}-placement
      containers:
        - name: placement-worker
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          command: ["./placement-worker"]
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: {{ .Values.name }}-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ .Values.name }}-postgresql
                  key: postgres-password
                  {{- else }}
                  name: {{ .Values.name }}-db
                  key: DB_PASSWORD
                  {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.placement.resources | nindent 12 }}
