apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
data:
  APP_PORT:             {{ .Values.app.port | quote }}
  APP_ENV:              {{ .Values.app.env | quote }}
  {{- if .Values.postgresql.enabled }}
  DB_HOST:              {{ printf "%s-postgresql" .Values.name | quote }}
  {{- else }}
  DB_HOST:              {{ .Values.db.host | quote }}
  {{- end }}
  DB_PORT:              {{ .Values.db.port | quote }}
  DB_USER:              {{ .Values.db.user | quote }}
  DB_NAME:              {{ .Values.db.name | quote }}
  DB_SSLMODE:           {{ .Values.db.sslmode | quote }}
  K8S_NAMESPACE_PREFIX: {{ .Values.k8s.namespacePrefix | quote }}
  VAULT_ADDR:           {{ .Values.vault.addr | quote }}
  VAULT_VTA_ADDR:       {{ .Values.vault.vtaAddr | default .Values.vault.addr | quote }}
  VAULT_KV_MOUNT:       {{ .Values.vault.kvMount | quote }}
  VAULT_K8S_AUTH_MOUNT: {{ .Values.vault.k8sAuthMount | quote }}
  VAULT_APPROLE_MOUNT:  {{ .Values.vault.appRoleMount | quote }}
  VAULT_SKIP_VERIFY:    {{ .Values.vault.skipVerify | quote }}
  CLUSTER_DOMAIN:       {{ required "cluster.domain is required - it is the zone tenant hostnames are created under" .Values.cluster.domain | quote }}
  MONITOR_CPU_PCT:            {{ .Values.monitor.cpuPct | quote }}
  MONITOR_MEM_PCT:            {{ .Values.monitor.memPct | quote }}
  MONITOR_STORAGE_PCT:        {{ .Values.monitor.storagePct | quote }}
  MONITOR_RESTART_WINDOW_MIN: {{ .Values.monitor.restartWindowMin | quote }}
  MONITOR_PENDING_GRACE_MIN:  {{ .Values.monitor.pendingGraceMin | quote }}
  MONITOR_EXTRA_NAMESPACES:   {{ .Values.monitor.extraNamespaces | quote }}
  PLACEMENT_MODE:                     {{ .Values.placement.mode | quote }}
  PLACEMENT_CANARY_SESSION_IDS:       {{ .Values.placement.canarySessionIDs | quote }}
  PLACEMENT_GREEN_BELOW_PCT:          {{ .Values.placement.greenBelowPct | quote }}
  PLACEMENT_YELLOW_BELOW_PCT:         {{ .Values.placement.yellowBelowPct | quote }}
  PLACEMENT_HOT_AT_PCT:               {{ .Values.placement.hotAtPct | quote }}
  PLACEMENT_HOT_OBSERVATION_MIN:      {{ .Values.placement.hotObservationMin | quote }}
  PLACEMENT_RECOVERY_OBSERVATION_MIN: {{ .Values.placement.recoveryObservationMin | quote }}
  PLACEMENT_METRICS_STALE_SECONDS:    {{ .Values.placement.metricsStaleSeconds | quote }}
  PLACEMENT_VTA_P95_MEMORY:           {{ .Values.placement.vtaP95Memory | quote }}
  PLACEMENT_POLL_SECONDS:              {{ .Values.placement.pollSeconds | quote }}
  GITHUB_PACKAGE_OWNER:      {{ .Values.github.packageOwner | quote }}
  GITHUB_PACKAGE_NAME:       {{ .Values.github.packageName | quote }}
  GITHUB_MEDIATOR_PACKAGE_NAME: {{ .Values.github.mediatorPackageName | quote }}
  GITHUB_DID_HOSTING_DAEMON_PACKAGE_NAME: {{ .Values.github.didHostingDaemonPackageName | quote }}
  WEBAUTHN_RP_ID:            {{ .Values.webauthn.rpID | default (include "app.frontendHost" .) | quote }}
  WEBAUTHN_RP_ORIGINS:       {{ .Values.webauthn.rpOrigins | default (include "app.frontendOrigin" .) | quote }}
  WEBAUTHN_RP_DISPLAY_NAME:  {{ .Values.webauthn.rpDisplayName | quote }}
  CORS_ALLOWED_ORIGINS:      {{ .Values.cors.allowedOrigins | default (include "app.frontendOrigin" .) | quote }}
  FARM_DID:                 {{ .Values.vtaClaim.farmDID | quote }}
  TRUST_TASK_BASE:          {{ .Values.vtaClaim.trustTaskBase | quote }}
  LINK_HOST:                {{ .Values.vtaClaim.linkHost | quote }}
  SIGN_IN_PORTAL_URL:       {{ .Values.vtaClaim.signInPortalURL | default (printf "%s/login" (include "app.frontendOrigin" .)) | quote }}
  FARM_DISPLAY_NAME:        {{ .Values.vtaClaim.farmDisplayName | quote }}
