name: vtafarm-api
replicaCount: 1

image:
  repository: ""
  tag: ""

service:
  port: 8080

ingress:
  host: ""

app:
  env: production
  port: "8080"

db:
  # When postgresql.enabled=true, host is auto-set to {{ .Values.name }}-postgresql.
  # When postgresql.enabled=false, set host to your external DB endpoint.
  host: ""
  port: "5432"
  user: postgres
  name: vtafarm
  sslmode: disable

postgresql:
  enabled: true
  # Exact patch, and identical to k8s/dev-postgres/deployment.yaml — `make test`
  # fails if the two drift. A floating 18-alpine would let production and the
  # shared dev database land on different patches without anyone choosing to.
  image: postgres:18.4-alpine
  # Pre-create with: kubectl create secret generic vtafarm-api-postgresql --from-literal=postgres-password='...'
  # The secret must contain key: postgres-password
  existingSecret: "vtafarm-api-postgresql"
  storage: 5Gi
  # No CPU limit: requests give fair-share under contention; a CFS quota would
  # throttle bursts on an idle node. Memory is incompressible, so it gets a hard limit.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

k8s:
  namespacePrefix: vtafarm-user

vault:
  addr: "https://vault.vault.svc:8200"
  # vtaAddr: address baked into VTA pod configs. Defaults to addr (in-cluster the
  # API and pods reach Vault at the same svc DNS). Override only if they differ.
  # vtaAddr: "https://vault.vault.svc:8200"
  kvMount: "secret"
  k8sAuthMount: "kubernetes"
  appRoleMount: "approle"
  skipVerify: "true"
  existingSecret: "vtafarm-api-vault"

cluster:
  domain: "firstperson.dev"

# Monitor endpoints (/api/v1/monitor/*) polled by UptimeRobot.
# MONITOR_TOKEN lives in the vtafarm-api-secrets Secret — see k8s/secret.yaml.example.
monitor:
  cpuPct: "90"
  memPct: "90"
  storagePct: "85"
  restartWindowMin: "15"
  pendingGraceMin: "10"
  extraNamespaces: "vault,vault-transit,longhorn-system"

github:
  packageOwner: ic3software
  packageName: vta
  mediatorPackageName: mediator
  didHostingDaemonPackageName: did-hosting-daemon

webauthn:
  rpID: "vtafarm.firstperson.dev"
  rpOrigins: "https://vtafarm.firstperson.dev"
  rpDisplayName: "VTA Farm"

# No CPU limit: the request gives fair-share under contention; a CFS quota
# would throttle bursts on an idle node. Memory keeps a hard limit.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
