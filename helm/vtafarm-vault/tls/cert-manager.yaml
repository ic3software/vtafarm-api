# Internal TLS for Vault (option B), issued by cert-manager.
#
# Chain:  selfSigned Issuer ──► CA cert (vault-ca, 10y) ──► CA Issuer
#                                                          └─► server cert (vault-tls, 90d, auto-renew)
#
# The `vault-tls` secret holds tls.crt / tls.key / ca.crt and is mounted by the
# Vault pods (see values.yaml). The CA is deliberately long-lived and stable so
# a future move to full client verification (option C) reuses the SAME CA — no
# cert re-issue, no client churn. Distribute `vault-ca`'s ca.crt to clients then.
#
# Apply BEFORE `helm install` and wait for the cert to be Ready:
#   kubectl apply -n vault -f helm/vtafarm-vault/tls/cert-manager.yaml
#   kubectl wait -n vault --for=condition=Ready certificate/vault-tls --timeout=120s
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned
  namespace: vault
spec:
  selfSigned: {}
---
# Long-lived internal CA — the stable trust anchor for both B and a later C.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: vault
spec:
  isCA: true
  commonName: vtafarm-vault-ca
  secretName: vault-ca
  duration: 87600h    # 10 years
  renewBefore: 2160h  # 90 days
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: vault-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-ca-issuer
  namespace: vault
spec:
  ca:
    secretName: vault-ca
---
# Vault server certificate. SANs cover the client service name (vault.vault.svc),
# the per-pod Raft peers (*.vault-internal), the active/standby services, and
# localhost for the in-pod CLI.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  duration: 2160h     # 90 days
  renewBefore: 360h   # 15 days
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: vault-ca-issuer
    kind: Issuer
  commonName: vault.vault.svc.cluster.local
  ipAddresses:
    - 127.0.0.1
  dnsNames:
    - localhost
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-active
    - vault-active.vault
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    - "*.vault-internal"
    - "*.vault-internal.vault.svc.cluster.local"
