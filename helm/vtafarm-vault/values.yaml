# Overrides for the official hashicorp/vault subchart (chart 0.33.0).
#
# Used IDENTICALLY for both the dev and production clusters — both are real
# clusters, so both run HA + Raft + auto-unseal. The only value that may
# legitimately differ per cluster is the auto-unseal KMS key in the `seal`
# block; keep that as a small per-cluster override if your keys differ.
#
# Everything MUST be nested under `vault:` because vault is a dependency
# subchart (see Chart.yaml). Keys map 1:1 to the upstream chart's values:
#   https://github.com/hashicorp/vault-helm/blob/v0.33.0/values.yaml
vault:
  # Pin the subchart's resource names to `vault` regardless of the Helm release
  # name. This makes the in-cluster names deterministic and matches the cert
  # SANs (tls/cert-manager.yaml) and the retry_join peer hostnames below:
  #   service        vault            → clients use https://vault.vault.svc:8200
  #   headless svc   vault-internal
  #   pods           vault-0 / -1 / -2 → peers vault-0.vault-internal, ...
  fullnameOverride: vault

  global:
    # In-cluster TLS is ON (option B). Vault is never exposed outside the cluster
    # (no ingress). The server cert is issued by cert-manager — apply
    # tls/cert-manager.yaml and wait for the `vault-tls` secret BEFORE installing.
    # VTA clients reach https://vault.vault.svc:8200 and (for now) set
    # vault_skip_verify=true, since the VTA config exposes no custom-CA path yet.
    tlsDisable: false

  # Vault Agent Injector: DISABLED on purpose.
  # VTA's `vault-secrets` backend authenticates to Vault natively via the
  # Kubernetes auth method and reads the seed itself — no sidecar injection,
  # no annotations. Keeping this off removes a Deployment and an attack surface.
  injector:
    enabled: false

  ui:
    enabled: true

  server:
    # Bind Vault's ServiceAccount to the system:auth-delegator ClusterRole so
    # Vault can call the TokenReview API to validate VTA pods' SA JWTs.
    # (Upstream default is already true; pinned here so it's explicit.)
    authDelegator:
      enabled: true

    # PersistentVolume for Raft data on every Vault pod.
    dataStorage:
      enabled: true
      size: 10Gi
      # storageClass: ""   # set if the cluster default isn't appropriate

    # Separate PVC for the audit-log device — the official guide enables this.
    # A secrets store should have a durable audit trail of every access. Enable
    # the file audit device after init: `vault audit enable file file_path=/vault/audit/audit.log`
    auditStorage:
      enabled: true
      size: 10Gi

    # Resource requests/limits — the guide requires them for cluster stability.
    # NOTE: the guide's reference numbers (8Gi req / 16Gi limit) are sized for
    # large-scale production. These are right-sized down for an early farm;
    # raise them toward the guide's values as tenant/load grows.
    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 2000m

    # Health probes pinned to the guide's endpoints (chart defaults are similar;
    # pinned here so the seal-aware readiness path is explicit and auditable).
    readinessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    livenessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true"
      initialDelaySeconds: 60

    # Pod anti-affinity: left at the chart default (HARD — one Vault pod per
    # node), which is what real HA wants. Irrelevant at replicas=1 (one pod).
    # When you scale back to replicas=3, run it on a MULTI-NODE cluster — a
    # single node can't satisfy the hard rule (extra pods would stay Pending).

    # Mount the cert-manager-issued TLS material (secret `vault-tls`, created by
    # tls/cert-manager.yaml). The Raft config below references these files.
    extraEnvironmentVars:
      VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
    volumes:
      - name: userconfig-vault-tls
        secret:
          secretName: vault-tls
    volumeMounts:
      - name: userconfig-vault-tls
        mountPath: /vault/userconfig/vault-tls
        readOnly: true

    # Token for the transit auto-unseal (orphan+periodic). Minted by
    # helm/vtafarm-transit/bootstrap-transit.sh into secret `vault-transit-token`.
    # The seal "transit" stanza below reads it from the VAULT_TOKEN env var.
    # This secret MUST exist before install/upgrade (deploy vtafarm-transit first).
    extraSecretEnvironmentVars:
      - envName: VAULT_TOKEN
        secretName: vault-transit-token
        secretKey: token

    # --- Auto-unseal credentials (uncomment for your cloud) -----------------
    # gcpckms / azurekeyvault need the Vault pods to carry cloud credentials.
    # GKE Workload Identity example (also fill the seal block below):
    # serviceAccount:
    #   annotations:
    #     iam.gke.io/gcp-service-account: vault-unseal@PROJECT.iam.gserviceaccount.com
    # AWS (awskms) typically uses IRSA / instance profile — no static creds needed.

    # High availability with integrated storage (Raft). No external Consul.
    ha:
      enabled: true
      # Testing phase: single node, so 1 replica. The retry_join stanzas below
      # still list vault-0/1/2 — harmless with 1 replica (the missing peers are
      # just retried in the background). Set back to 3 for real HA once you have
      # a multi-node cluster.
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          cluster_name = "vtafarm-vault"

          listener "tcp" {
            address          = "[::]:8200"
            cluster_address  = "[::]:8201"
            tls_cert_file    = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file     = "/vault/userconfig/vault-tls/tls.key"
            tls_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }

          storage "raft" {
            path = "/vault/data"
            # Peers auto-join over TLS (official guide pattern). One stanza per
            # replica; keep in sync with server.ha.replicas above.
            retry_join {
              leader_api_addr         = "https://vault-0.vault-internal:8200"
              leader_ca_cert_file     = "/vault/userconfig/vault-tls/ca.crt"
              leader_client_cert_file = "/vault/userconfig/vault-tls/tls.crt"
              leader_client_key_file  = "/vault/userconfig/vault-tls/tls.key"
            }
            retry_join {
              leader_api_addr         = "https://vault-1.vault-internal:8200"
              leader_ca_cert_file     = "/vault/userconfig/vault-tls/ca.crt"
              leader_client_cert_file = "/vault/userconfig/vault-tls/tls.crt"
              leader_client_key_file  = "/vault/userconfig/vault-tls/tls.key"
            }
            retry_join {
              leader_api_addr         = "https://vault-2.vault-internal:8200"
              leader_ca_cert_file     = "/vault/userconfig/vault-tls/ca.crt"
              leader_client_cert_file = "/vault/userconfig/vault-tls/tls.crt"
              leader_client_key_file  = "/vault/userconfig/vault-tls/tls.key"
            }
          }

          service_registration "kubernetes" {}

          # ─── AUTO-UNSEAL via in-cluster Transit Vault ───────────────────────
          # The farm Vault auto-unseals using the standalone transit Vault in the
          # vault-transit namespace (helm/vtafarm-transit). Deploy + bootstrap
          # that chart FIRST so the `vault-transit-token` secret exists.
          # The token is supplied as VAULT_TOKEN (extraSecretEnvironmentVars above);
          # tls_skip_verify=true because the transit Vault uses its own self-signed CA.
          seal "transit" {
            address         = "https://vault-transit.vault-transit.svc:8200"
            key_name        = "autounseal"
            mount_path      = "transit/"
            disable_renewal = "false"
            tls_skip_verify = "true"
          }

          # To migrate to cloud KMS later (zero other changes), replace the seal
          # stanza above with one of these and delete the vtafarm-transit chart:
          #   seal "gcpckms" { project=... region="global" key_ring=... crypto_key=... }
          #   seal "awskms"  { region="us-east-1" kms_key_id="alias/vault-unseal" }
