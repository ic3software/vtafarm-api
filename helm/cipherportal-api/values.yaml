name: cipherportal-api
replicaCount: 1

image:
  repository: ""
  tag: ""

service:
  port: 8080

ingress:
  host: ""

app:
  env: production
  port: "8080"

db:
  # When postgresql.enabled=true, host is auto-set to {{ .Release.Name }}-postgresql.
  # When postgresql.enabled=false, set host to your external DB endpoint.
  host: ""
  port: "5432"
  user: postgres
  name: cipherportal
  sslmode: disable

postgresql:
  enabled: true
  image: postgres:18-alpine
  # Pre-create with: kubectl create secret generic cipherportal-postgresql --from-literal=postgres-password='...'
  # The secret must contain key: postgres-password
  existingSecret: "cipherportal-postgresql"
  storage: 5Gi

k8s:
  namespacePrefix: cp-user

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
