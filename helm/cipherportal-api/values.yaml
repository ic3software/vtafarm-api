name: cipherportal-api
replicaCount: 1

image:
  repository: ""
  tag: ""

service:
  port: 8080

ingress:
  host: ""

app:
  env: production
  port: "8080"

db:
  # When postgresql.enabled=true, host is auto-set to {{ .Values.name }}-postgresql.
  # When postgresql.enabled=false, set host to your external DB endpoint.
  host: ""
  port: "5432"
  user: postgres
  name: cipherportal
  sslmode: disable

postgresql:
  enabled: true
  image: postgres:18-alpine
  # Pre-create with: kubectl create secret generic cipherportal-api-postgresql --from-literal=postgres-password='...'
  # The secret must contain key: postgres-password
  existingSecret: "cipherportal-api-postgresql"
  storage: 5Gi

k8s:
  namespacePrefix: cp-user

cluster:
  ingressIP: "95.217.184.144"
  domain: "ic3.dev"

github:
  packageOwner: ic3software
  packageName: vta

webauthn:
  rpID: "cipher.ic3.dev"
  rpOrigins: "https://cipher.ic3.dev"
  rpDisplayName: "CipherPortal"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
