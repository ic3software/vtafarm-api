  # ── User ────────────────────────────────────────────────────────────────────

  /api/v1/user/me:
    get:
      summary: Get the caller's own profile
      description: |
        Returns the logged-in user's own `beta_access` state, fetched fresh from
        the database (not from the JWT, which doesn't carry it — an admin can
        flip it at any time without the user needing to log in again). The
        frontend uses this to decide whether to offer `mode=full_stack` on the
        setup wizard.
      tags: [User]
      security:
        - CookieAuthUser: []
      responses:
        "200":
          description: Caller's profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "a1b2c3d4"
                  beta_access:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/domains:
    get:
      summary: List the caller's domains
      description: |
        At most one row: a user may hold one custom domain. **No DNS lookups** —
        the records come back with `checked: false` so the UI can show them
        without a verdict, and resolution happens on `GET /domains/{id}` or
        `POST /domains/{id}/verify`.

        The cluster needs its one-off prerequisites — the grey-cloud `lb` /
        `dev-lb` records and the ACME ClusterIssuers — before any verification
        can pass. Until then attaching works and the check fails with a reason,
        which tells an operator more than a hidden route would.
      tags: [User]
      security:
        - CookieAuthUser: []
      responses:
        "200":
          description: The caller's domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Attach a domain
      description: |
        Creates the row, mints a fresh TXT token, and returns the five records
        to create. Nothing is resolved yet: the records don't exist, and
        checking now would only teach the public resolvers an NXDOMAIN the user
        then has to wait out.

        The input is normalised first — lowercased, scheme and path stripped,
        trailing dot removed, IDN punycoded — so `https://AAA.com/` and
        `aaa.com` are the same domain.

        **A new token on every attach**, and it never rotates while the domain
        sits pending. That is what closes the dangling-DNS takeover: a user who
        deletes their session but leaves their CNAMEs behind hands the next
        person records already pointing at us, but not the ability to write a
        token into a zone they don't control.

        The TXT record **may be deleted once verification succeeds** — it is
        checked at verification time only, and never re-checked, so tidying DNS
        later can't break a running session.
      tags: [User]
      security:
        - CookieAuthUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: aaa.com
                  description: The registrable domain or any subdomain of it — not a hostname we create under it.
      responses:
        "201":
          description: Domain attached, pending verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "400":
          description: |
            Invalid domain; `CLUSTER_DOMAIN` or a subdomain of it (refused for
            **every** caller, admins included — the only route that may mint a
            row for our own zone is `POST /admin/platform-stack`); a hostname we
            would create (`vta.aaa.com`); a name no public CA can issue for
            (IP literal, `localhost`, `.local`/`.internal`/`.test`/`.invalid`/
            `.example`); or a domain long enough that one of the four FQDNs
            would exceed 253 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The caller already has a custom domain, or this domain is attached to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/domains/{id}:
    get:
      summary: Domain detail, resolved live
      description: |
        Runs the same check as `POST /domains/{id}/verify` and promotes the
        domain to verified when everything passes. The portal does not call it
        — it reads the list and checks only when the user asks — so this is the
        read-only way for anything else to see a domain's live DNS state.

        Cheap after success: an already-verified domain performs **no lookups
        at all**. Verification is a one-time proof, not a liveness check.

        Subject to the same one-minute per-domain cooldown as the verify route
        (429), so reaching for this one is not a way around it, plus the per-IP
        limit both share.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current state of the domain and its five records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not the caller's domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Either the per-domain cooldown — one check per minute, body carries
            `retry_after` — or the per-IP limit both routes share. Neither
            resolved anything, so nothing about the domain has changed.
          headers:
            Retry-After:
              description: Seconds to wait. Sent with the per-domain cooldown.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimited"
    delete:
      summary: Remove a domain
      description: |
        Always allowed while nothing runs on it — a pending domain holds no
        cluster resources and reserves nothing but its row.

        The four CNAMEs stay in the user's zone: we never created them and have
        no access. **Tell the user to remove them** — a record left aimed at our
        ingress is exactly the dangling-DNS setup the per-attach token defuses.

        **The domain's TLS certificate and its Secret are deleted here.**
        Deleting a *session* keeps them on purpose, so a rebuild reuses the
        certificate and spends no ACME quota; detaching the domain is where that
        stops applying. The account is giving up the names, someone else may
        attach them next, and re-attaching mints a new domain id anyway — so a
        kept certificate would be unreachable key material for names its holder
        no longer claims. A re-attach therefore starts from a fresh issuance.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Domain removed
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not the caller's domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A session is running on this domain — delete that session first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/domains/{id}/verify:
    post:
      summary: Check the domain's DNS
      description: |
        Resolves the TXT challenge and all four CNAMEs in parallel against
        public resolvers (1.1.1.1, falling back to 8.8.8.8), and sets
        `verified_at` when every one passes.

        **Both record types are required.** The CNAMEs prove traffic routes to
        us; they do not prove the person asking controls the name. The TXT is
        what makes those two the same claim.

        A failing check answers **200, not 4xx** — it is an expected, retryable
        state the UI renders record by record, not a client error. Read each
        record's `detail` for why.

        **One check per domain per minute.** Asking again sooner answers 429
        with `retry_after` (seconds) and a `Retry-After` header — a second
        check that soon queries public resolvers five more times to report what
        the last one already said. `last_checked_at` on any domain response is
        when the window started, so a client can count down instead of
        guessing.

        Two things users hit, worth surfacing in the UI: a domain on Cloudflare
        must have all four CNAMEs **DNS only (grey cloud)**, and a name checked
        *before* it existed can take up to an hour to clear from public
        resolvers' negative cache.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Check performed — read `verified` for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
              example:
                id: 3
                domain: aaa.com
                kind: custom
                verified: false
                verified_at: null
                target: lb.firstperson.dev
                checked: true
                txt:
                  name: _vtafarm-challenge.aaa.com
                  expected: vtafarm-verify=a3f9c2e8
                  found: ["vtafarm-verify=00000000"]
                  ok: false
                  detail: no TXT value matches — an older token may still be present
                records:
                  - component: vta
                    fqdn: vta.aaa.com
                    expected_type: CNAME
                    expected_value: lb.firstperson.dev
                    resolved: ["157.180.68.139"]
                    ok: true
                  - component: vtc
                    fqdn: vtc.aaa.com
                    expected_type: CNAME
                    expected_value: lb.firstperson.dev
                    resolved: []
                    ok: false
                    detail: no record found
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not the caller's domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Either the per-domain cooldown — one check per minute, body carries
            `retry_after` — or the per-IP limit both routes share. Neither
            resolved anything, so nothing about the domain has changed.
          headers:
            Retry-After:
              description: Seconds to wait. Sent with the per-domain cooldown.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimited"

  /api/v1/setup/validate:
    post:
      summary: Validate setup prerequisites
      description: |
        Verifies Cloudflare connectivity and that CLUSTER_INGRESS_IP is configured.
        Applies to both modes — full_stack additionally needs all four hostnames
        (vta/mediator/dids/vtc) to be creatable, which the same Cloudflare zone
        check covers.
      tags: [User]
      security:
        - CookieAuthUser: []
      responses:
        "200":
          description: Validation passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Cluster ingress IP not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Cloudflare connectivity failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Cloudflare not configured on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/images:
    get:
      summary: List available component images
      description: |
        Returns available container image tags fetched from GHCR, for the component
        selected by `?component=`. Use this to populate the image version dropdown
        before creating a session — `vta_image` (both modes), and
        `mediator_image`/`dids_image`/`vtc_image` (full_stack) on `POST /setup`.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: component
          in: query
          required: false
          description: Which component's image tags to list.
          schema:
            type: string
            enum: [vta, mediator, dids, vtc]
            default: vta
      responses:
        "200":
          description: List of available image versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tag:
                      type: string
                      example: "0.9.0-917881c"
                    image:
                      type: string
                      example: "ghcr.io/ic3software/vta:0.9.0-917881c"
                    latest:
                      type: boolean
                      description: True on the versioned tag that "latest" currently points to. Absent on all other tags. This entry is always first in the list.
                      example: true
        "400":
          description: Unknown component value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Failed to fetch tags from GHCR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Image source not configured for the requested component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/availability:
    get:
      summary: Whether each mode can be created, and why not
      description: |
        Drives the create screen's "Unavailable" state, so the button is
        disabled before the user fills anything in. Two independent things fold
        into one `available` per mode, with `reason` saying which applies.

        **Capacity** — how many more sessions of that mode the cluster can still
        schedule (a placement simulation, not free/cost division). `count` is
        that number. This **fails open**: when the cluster can't be read at all
        (no Kubernetes client, or metrics-server / Longhorn unreachable) it
        returns `determinable: false` and blocks nothing, so a transient outage
        never wrongly stops creation.

        **The platform stack** — `vta_only` is only the VTA, wired to the
        mediator and DID hosting the platform stack provides. Until an admin has
        created that stack, it has reached `running`, and this server has been
        pointed at its collected values, a `vta_only` agent could only ever be
        born unable to deliver a message. That is a hard prerequisite, so unlike
        capacity it does **not** fail open. `full_stack` provisions its own
        mediator and DID host and is never gated on it.

        `POST /setup` enforces both and answers 503 either way — this endpoint
        only makes the refusal visible earlier.
      tags: [User]
      security:
        - CookieAuthUser: []
      responses:
        "200":
          description: Per-mode remaining capacity
          content:
            application/json:
              schema:
                type: object
                properties:
                  vta_only:
                    $ref: "#/components/schemas/ModeAvailability"
                  full_stack:
                    $ref: "#/components/schemas/ModeAvailability"
                  metrics_available:
                    type: boolean
                    description: False when metrics-server was unreachable (capacity then planned from reservations only).
                  storage_available:
                    type: boolean
                    description: False when Longhorn stats were unavailable (storage then doesn't constrain the estimate).
                  determinable:
                    type: boolean
                    description: False when the cluster couldn't be read at all; the capacity figures are then a fail-open default. Does not affect the platform-stack prerequisite.
                example:
                  vta_only:
                    count: 12
                    available: false
                    reason: platform_stack_missing
                    detail: >-
                      VTA-only agents need the platform stack — the shared mediator and DID
                      hosting they connect to. An admin has to create it before any VTA-only
                      agent can be provisioned.
                    custom_target_allowed: true
                  full_stack: { count: 2, available: true }
                  metrics_available: true
                  storage_available: true
                  determinable: true
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/domain-info:
    get:
      summary: Hostname facts for this environment
      description: |
        Everything the create screen needs to describe the hostnames a session
        will get, so hints aren't hardcoded to the production shape
        (`vta-{vta_name}.firstperson.dev`), which is wrong in development.

        A locally run API prefixes every DNS label it creates with `env_prefix`
        (`dev-`), so the same name yields `vta-alice` in production and
        `dev-vta-alice` in development. Both records live in the same
        Cloudflare zone; the prefix is what keeps them apart and sorted
        together.

        `target_ip` and `target_host` describe where a user-owned custom domain
        must point — `target_host` is what its four CNAMEs name, and
        `target_ip` what they must ultimately resolve to.
      tags: [User]
      security:
        - CookieAuthUser: []
      responses:
        "200":
          description: Hostname facts
          content:
            application/json:
              schema:
                type: object
                properties:
                  managed_domain:
                    type: string
                    description: The zone managed sessions are created under (CLUSTER_DOMAIN).
                  env_prefix:
                    type: string
                    description: Prefixed onto every DNS label this API creates — `dev-` in development, empty in production.
                  target_ip:
                    type: string
                    description: External IP of the cluster ingress (CLUSTER_INGRESS_IP). Empty when the cluster isn't configured.
                  target_host:
                    type: string
                    description: Hostname a custom domain's records point at — always `{env_prefix}lb.{managed_domain}`. That record must be grey-cloud (DNS only) in the zone; a proxied one answers other people's hostnames with Cloudflare error 1014.
                example:
                  managed_domain: firstperson.dev
                  env_prefix: "dev-"
                  target_ip: 157.180.68.139
                  target_host: dev-lb.firstperson.dev
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup:
    post:
      summary: Create setup session
      description: |
        Subdomains are derived from the user-chosen `vta_name` (409 if the
        name is already in use by any session).

        vta_only: creates a Cloudflare DNS A record for vta-{vta_name} under
        CLUSTER_DOMAIN, stores the session, and begins async VTA setup.

        full_stack: derives four hostnames (vta-{vta_name} /
        mediator-{vta_name} / dids-{vta_name} under CLUSTER_DOMAIN, plus
        vtc-{vtc_name} from the VTC's own name), creates all four Cloudflare
        DNS A records up front, stores the session, and begins the async
        VTA + Mediator + DID-hosting daemon + VTC state machine. The VTC is
        always provisioned, so `vtc_image` and `vtc_name` are required;
        `vtc_name` doubles as the VTA context id.

        **`mode=full_stack` requires the caller's
        `beta_access` to be `true`** (see `GET /user/me`); an admin grants this via
        `PUT /admin/users/{id}/beta-access`.

        **On a custom domain (`domain_id`) none of the above applies to the
        names.** The four hostnames are fixed (`vta.aaa.com`, `vtc.`,
        `mediator.`, `dids.`), so `vta_name`/`vtc_name` must be absent and a
        single `label` replaces them. No DNS is created either: the records are
        the user's, already verified, and we never touch their zone — which is
        also why teardown leaves them behind for the user to remove.
      tags: [User]
      security:
        - CookieAuthUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupRequest"
      responses:
        "201":
          description: Setup session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSetupResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: mode=full_stack requested but the caller doesn't have beta_access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`domain_id` is not one of the caller's domains"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `vta_name` (or `vtc_name`) already in use, or the domain is
            unverified / already backs a session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Cluster ingress IP not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Failed to create DNS record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Cloudflare not configured on server; the cluster is at capacity; or —
            for `vta_only` — the platform stack that provides its mediator and
            DID hosting isn't ready. See `GET /setup/availability`, which reports
            all three ahead of time with a `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List setup sessions
      description: Returns all setup sessions owned by the requesting user, newest first.
      tags: [User]
      security:
        - CookieAuthUser: []
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupSessionItem"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}:
    get:
      summary: Get setup session
      description: Returns the current status of a setup session. Poll this endpoint to track progress.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSetupSessionResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete setup session
      description: |
        Cancels the session goroutine and tears down its resources.
        vta_only: the Cloudflare DNS record, K8s resources, and the session's Vault seed.
        full_stack: all four Cloudflare DNS records, all four components' K8s
        resources, the mediator's/dids daemon's/VTC's Vault secrets, and the
        VTA's Vault seed.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
      responses:
        "204":
          description: Session deleted
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Failed to delete DNS record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}/upgrade:
    post:
      summary: Change the session's component images (self-service)
      description: |
        Upgrades or downgrades components of the caller's OWN session to the
        requested images — the session is looked up by vta_name AND the
        authenticated user's id, so a user can never change another user's
        session. Each image must exist in its component's GHCR tag list
        (`GET /setup/images?component=…`), the component must belong to the
        session's mode, and the session must be `running`. Creates a
        single-session upgrade batch processed by the same background runner
        as admin rollouts; the response returns immediately — poll
        `GET /setup/{id}/upgrade` for progress. Only one change at a time per
        session: 409 while tasks are still pending/running (including an
        admin-initiated rollout touching this session). A previous
        self-service upgrade of this session that paused on a failure is
        superseded (cancelled) by the new request.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [components]
              properties:
                components:
                  type: array
                  minItems: 1
                  description: Target image per component (no duplicates). Any served image — upgrade or downgrade.
                  items:
                    type: object
                    required: [component, image]
                    properties:
                      component:
                        type: string
                        enum: [vta, mediator, dids, vtc]
                      image:
                        type: string
                        example: "ghcr.io/ic3software/vta:0.9.0-917881c"
      responses:
        "201":
          description: Upgrade created and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUpgrade"
        "400":
          description: Invalid component for the session's mode, image not in the registry, or already on that image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found (or owned by another user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Session not running, or an upgrade is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Failed to fetch tags from GHCR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: K8s or image source not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Get the session's latest self-service upgrade
      description: |
        The caller's most recent upgrade of this session with per-component
        task state — the progress view polls this. 404 until the user has
        upgraded the session at least once; admin-initiated rollouts are not
        shown. A `paused` status means the upgrade stopped on a failure —
        the failed task's `error_msg` says why.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
      responses:
        "200":
          description: Latest upgrade with tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUpgrade"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found, or no upgrade yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}/logs:
    get:
      summary: Stream logs
      description: |
        Server-Sent Events (SSE) stream.

        **Optional query param `?source=`** explicitly selects the log source regardless
        of session status. Holds the connection open until the pod is ready, then streams.

        **vta_only**: `setup | provision | vta`. Without `?source`, the source is chosen
        by session status:
        - `vta_setup_running` — live output from the vta-setup K8s Job
        - `provisioning` — live output from the vta-provision K8s Job (import-did + did-mgmt servers add)
        - `running` — live output from the running VTA pod
        - `vta_setup_complete` — replays buffered vta-setup job output then closes
        - `failed` — replays the last job's output then closes
        - `dns_provisioned` — returns 409 (not started yet)

        **full_stack**: `vta_setup | mediator_p1 | mediator_reprov | mediator_p2 | dids_p1 |
        dids_provision | dids_p2 | dids_invite | dids_load_did |
        vta_register_dids | import_admin_did | vta | mediator | dids` (the first eleven
        stream a one-off setup Job's logs; the last three stream the corresponding running
        pod). Without `?source`, the source is derived from the session's current step
        status.

        full_stack also accepts `vtc_setup_key | vtc_acl_grant | vtc_setup`
        (one-off Job logs) and `vtc` (the running VTC pod).

        Each event is a plain log line: `data: <line>\n\n`.
        A final `event: done` signals the end of the stream.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - setup
              - provision
              - vta
              - mediator
              - dids
              - vta_setup
              - mediator_p1
              - mediator_reprov
              - mediator_p2
              - dids_p1
              - dids_provision
              - dids_p2
              - dids_invite
              - dids_load_did
              - vta_register_dids
              - import_admin_did
              - vtc_setup_key
              - vtc_acl_grant
              - vtc_setup
              - vtc
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup not started yet (status is dns_provisioned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: K8s not configured on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}/admin:
    post:
      summary: Provision admin DID
      description: |
        Phase 2 of setup: imports an admin DID into the VTA, then creates the VTA Deployment and Service.
        Session must be in `vta_setup_complete` status (vta_only) or `awaiting_admin_did` status
        (full_stack) before calling this — same endpoint, shared PNM admin-DID handshake for both modes.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_did:
                  type: string
                  description: DID to import as admin into the VTA
                  example: "did:key:z6Mk..."
              required: [admin_did]
      responses:
        "202":
          description: Provisioning started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: provisioning
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Session not in the mode-appropriate ready status (vta_setup_complete / awaiting_admin_did)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: K8s not configured on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}/dids/reissue-enroll:
    post:
      summary: Reissue dids admin enrollment URL
      description: |
        full_stack only. Regenerates the single-use dids admin-panel enrollment URL
        (re-runs `did-hosting-daemon invite --role admin`) — useful if the original URL
        (returned once from `step_dids_invite` / `GET /setup/{id}`) was lost or already
        consumed. Scales the dids Deployment to 0 and waits for its pod to terminate
        (releasing the exclusive lock on the daemon's local store), runs the invite Job,
        then scales the daemon back to 1 — the daemon is restarted even if the job
        itself fails. On success, resets `dids_enroll_used` to false.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
      responses:
        "200":
          description: New enrollment URL minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  dids_admin_enroll_url:
                    type: string
                    example: "https://dids.example.com/enroll/abc123"
        "400":
          description: Session is not a full_stack session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: dids daemon not provisioned yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Reissue job failed or its output could not be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: K8s not configured on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}/dids/enroll-ack:
    post:
      summary: Acknowledge dids admin enrollment URL as used
      description: |
        full_stack only. Called by the frontend the moment the user opens
        `action_required.dids_admin_enroll_url` — marks `dids_enroll_used` true so
        `GET /setup/{id}` stops offering that (single-use) URL. Call
        `POST /setup/{id}/dids/reissue-enroll` to mint a fresh one afterwards.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "ab12cd34"
      responses:
        "200":
          description: Marked as used
          content:
            application/json:
              schema:
                type: object
                properties:
                  dids_enroll_used:
                    type: boolean
                    example: true
        "400":
          description: Session is not a full_stack session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No dids enrollment URL has been issued yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}/vtc/reissue-install:
    post:
      summary: Reissue VTC admin install URL + claim code
      description: |
        full_stack only. Remints the one-shot VTC admin install URL **and**
        claim code by re-running `vtc admin invite` against the stopped VTC's local
        store. The setup-minted install token expires after 15 minutes, so this is the
        *expected* way users actually claim the VTC admin, not an edge case.

        Scales the VTC Deployment to 0 and waits for its pod to terminate (releasing
        the exclusive lock on the local store), runs the invite Job, then scales the
        VTC back to 1 — the service is restarted even if the job itself fails. On
        success, resets `vtc_install_used` to false.
      tags: [User]
      security:
        - CookieAuthUser: []
      parameters:
        - name: id
          in: path
          required: true
