            example: "ab12cd34"
      responses:
        "200":
          description: Fresh install URL + claim code minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  install_url:
                    type: string
                    example: "https://vtc-myvtc.example.com/admin/install?token=..."
                  claim_code:
                    type: string
                    example: "ABCD-1234"
        "400":
          description: Session is not a full_stack session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: VTC not provisioned yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Reissue job failed or its output could not be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
