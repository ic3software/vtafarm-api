  # ── Signup ──────────────────────────────────────────────────────────────────

  /api/v1/signup:
    post:
      summary: "(public) Sign up with an email"
      description: |
        Self-service account creation from the home page. The email is a
        self-declared label — nothing is ever sent to it and ownership is not
        verified; the passkey registered right after this call is what
        authenticates the account.

        On success the `vtafarm_user` cookie is set so the caller can
        immediately continue with `POST /user/passkeys/register/begin` +
        `complete`. Until that first passkey exists, repeating this call with
        the same email resumes the same account (fresh cookie, no duplicate),
        so an abandoned or failed passkey ceremony never strands the email.
        Once a passkey exists the email is taken for good and answers 409.

        Rate-limited per client IP.
      tags: [Auth — User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "201":
          description: Account created and logged in (cookie set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  unique_id:
                    type: string
                    example: "a1b2c3d4"
                  token:
                    type: string
                    description: JWT, also set as the vtafarm_user cookie.
        "200":
          description: Existing passkey-less account resumed (cookie set); same body as 201
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  unique_id:
                    type: string
                  token:
                    type: string
        "400":
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered to an account with a passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Account recovery ────────────────────────────────────────────────────────

  /api/v1/recovery/{token}:
    get:
      summary: "(public) Validate a recovery link"
      description: Checks whether an admin-issued recovery link is still usable.
      tags: [Auth — User]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Link is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Link already used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "(public) Consume a recovery link"
      description: |
        Burns the link (single-use, guarded against concurrent consumes),
        **revokes every passkey on the account**, and sets the `vtafarm_user`
        cookie so the holder can immediately register a fresh passkey via
        `POST /user/passkeys/register/begin` + `complete`. If that ceremony
        fails, the 24-hour cookie still allows adding a passkey from Settings;
        otherwise the admin simply issues another link. Rate-limited per
        client IP.
      tags: [Auth — User]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logged in to the recovered account (cookie set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  unique_id:
                    type: string
                    example: "a1b2c3d4"
                  token:
                    type: string
                    description: JWT, also set as the vtafarm_user cookie.
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Link already used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

