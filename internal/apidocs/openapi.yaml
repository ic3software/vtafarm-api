          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/{id}/vtc/install-ack:
    post:
      summary: Acknowledge VTC install URL as used
      description: |
        full_stack only. Called by the frontend the moment the user opens
