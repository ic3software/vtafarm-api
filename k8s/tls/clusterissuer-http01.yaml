# HTTP-01 issuer for CUSTOM domains — zones our users own.
#
#   kubectl apply -f k8s/tls/clusterissuer-http01.yaml
#
# One issuer, every environment. There is deliberately no staging twin.
#
# ── Why not staging ──────────────────────────────────────────────────────────
#
# A staging certificate chains to a root no public trust store carries, and this
# pipeline does not merely serve TLS: from step_vta_register_dids onward the
# components resolve each other's did:webvh identifiers over HTTPS, and those
# clients reject an untrusted chain outright. So a staging certificate passes
# tls_provision — cert-manager only asks "was it issued?" — and then fails
# several steps later in a mediator crash loop whose error names a network
# problem rather than a certificate one. Development could never complete a
# custom-domain session at all, which is worth more than the quota it saved.
#
# ── What that costs, and how to stay inside it ───────────────────────────────
#
# Every environment now spends the same allowances, and neither can be raised by
# asking:
#
#   - five authorization failures per hostname per hour
#   - five certificates per identical set of names per week
#
# A custom domain always requests the same four names, so the weekly one binds:
# it caps how many times a given domain's certificate can be issued from
# scratch, counted across every environment sharing this issuer. Keep
# development iteration on domains we own rather than a customer's, and reuse an
# already-issued Secret instead of requesting again wherever the code allows.
#
# ── Why HTTP-01 ──────────────────────────────────────────────────────────────
#
# These are zones our users own, which we cannot answer a DNS-01 challenge for.
# HTTP-01 works precisely because the user has already pointed the hostname at
# our ingress: that record IS the proof of control, and nobody without it can
# obtain the certificate.
#
# Distinct from k8s/tls/clusterissuer.yaml (`letsencrypt-prod`), which issues the
# *.firstperson.dev wildcard over DNS-01 against our own Cloudflare zone. That
# one covers every managed and platform hostname, so those never reach this
# issuer at all — and it is in use, so do not confuse the two.
#
# The email is OURS, not the customer's. ACME validates control of a name, not
# ownership of it — we are the subscriber, and putting a customer's address here
# would misrepresent who operates the certificate. (Let's Encrypt stopped
# sending expiry notifications in June 2025 anyway; expiry monitoring belongs in
# our own /api/v1/monitor/* endpoints.)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@firstperson.dev
    privateKeySecretRef:
      name: letsencrypt-http01
    solvers:
    - http01:
        ingress:
          class: nginx
